<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -32 32 64" data-title="Capacitor with ESR/ESL"
     fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <style>.fill{fill:#000}.bold{stroke-width:3.2}.dash{stroke-dasharray:3 2.5}[data-pin]{fill:#d00;stroke:none}</style>
  <!-- The plates of the ideal capacitor, with a small series resistor below them: the ESR (and ESL) path. -->
  <path d="M0 -32 V-17.52 M0 -2.48 V6 M0 22 V32"/>
  <rect x="-12" y="-17.52" width="24" height="4.8" class="fill"/>
  <rect x="-12" y="-7.28" width="24" height="4.8" class="fill"/>
  <rect x="-4.4" y="6" width="8.8" height="16" class="bold"/>
  <circle data-pin="p" data-alias="n+ + a 1 pos" data-dir="up" cx="0" cy="-32" r="2"/>
  <circle data-pin="n" data-alias="n- - b 2 neg" data-dir="down" cx="0" cy="32" r="2"/>
</svg>
