<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -32 96 64" data-title="Separately excited DC machine"
     fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <style>.fill{fill:#000}.bold{stroke-width:3.2}.dash{stroke-dasharray:3 2.5}[data-pin]{fill:#d00;stroke:none}[data-logic]{fill:#c90;stroke:none}</style>
  <!-- Armature as dcmachinepm.svg; the field winding is the coil on the
       left with its own pair of terminals (fp top, fn bottom). -->
  <circle cx="0" cy="0" r="20" class="bold"/>
  <rect x="-5" y="-25" width="10" height="5" class="fill"/>
  <rect x="-5" y="20" width="10" height="5" class="fill"/>
  <path d="M0 -32 V-25 M0 25 V32"/>
  <path d="M-8 6 V-6 L0 3 L8 -6 V6"/>
  <path d="M-48 -32 V-16 M-48 16 V32"/>
  <path d="M-48 -16 a4 4 0 0 1 0 8 a4 4 0 0 1 0 8 a4 4 0 0 1 0 8 a4 4 0 0 1 0 8" class="bold"/>
  <path d="M20 -3 H27 V3 H20" class="bold"/>
  <path d="M27 0 H32"/>
  <circle data-pin="ap" data-alias="a1 a +" data-dir="up" cx="0" cy="-32" r="2"/>
  <circle data-pin="an" data-alias="a2 b -" data-dir="down" cx="0" cy="32" r="2"/>
  <circle data-pin="fp" data-alias="f1 field_p" data-dir="up" cx="-48" cy="-32" r="2"/>
  <circle data-pin="fn" data-alias="f2 field_n" data-dir="down" cx="-48" cy="32" r="2"/>
  <circle data-pin="shaft" data-alias="rotor mech" data-dir="right" cx="32" cy="0" r="2"/>
</svg>
