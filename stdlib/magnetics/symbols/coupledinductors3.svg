<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -40 64 80" data-title="Three coupled inductors"
     fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <style>.fill{fill:#000}.bold{stroke-width:3.2}.dash{stroke-dasharray:3 2.5}[data-pin]{fill:#d00;stroke:none}</style>
  <!-- Winding 1 on the left, windings 2 and 3 on the right, no core. Dots on p1, p2 and p3. -->
  <path d="M-32 -16 H-8 M-32 16 H-8 M8 -32 H32 M8 -16 H32 M8 16 H32 M8 32 H32"/>
  <path d="M-8 -16 a4 4 0 0 1 0 8 a4 4 0 0 1 0 8 a4 4 0 0 1 0 8 a4 4 0 0 1 0 8" class="bold"/>
  <path d="M8 -32 a4 4 0 0 0 0 8 a4 4 0 0 0 0 8" class="bold"/>
  <path d="M8 16 a4 4 0 0 0 0 8 a4 4 0 0 0 0 8" class="bold"/>
  <circle cx="-14" cy="-22" r="1.8" class="fill"/>
  <circle cx="14" cy="-38" r="1.8" class="fill"/>
  <circle cx="14" cy="10" r="1.8" class="fill"/>
  <circle data-pin="p1" data-alias="1" data-dir="left" cx="-32" cy="-16" r="2"/>
  <circle data-pin="n1" data-dir="left" cx="-32" cy="16" r="2"/>
  <circle data-pin="p2" data-alias="2" data-dir="right" cx="32" cy="-32" r="2"/>
  <circle data-pin="n2" data-dir="right" cx="32" cy="-16" r="2"/>
  <circle data-pin="p3" data-alias="3" data-dir="right" cx="32" cy="16" r="2"/>
  <circle data-pin="n3" data-dir="right" cx="32" cy="32" r="2"/>
</svg>
