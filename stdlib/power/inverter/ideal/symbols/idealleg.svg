<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -80 64 160" data-title="Ideal inverter leg"
     fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <style>.fill{fill:#000}.bold{stroke-width:3.2}.dash{stroke-dasharray:3 2.5}[data-pin]{fill:#d00;stroke:none}[data-logic]{fill:#c90;stroke:none}</style>
  <!-- A top and a bottom switch between dc_p and dc_n, output from the midpoint; the command s (dashed) is drawn to the top switch, the bottom one is its complement. -->
  <path d="M0 -48 V-40 M0 -16 V16 M0 40 V48"/>
  <circle cx="0" cy="-40" r="2"/>
  <circle cx="0" cy="-16" r="2"/>
  <circle cx="0" cy="16" r="2"/>
  <circle cx="0" cy="40" r="2"/>
  <path d="M0 -16 L-12 -38 M0 40 L-12 18"/>
  <path d="M-32 -32 H-8.73" class="dash"/>
  <circle cx="0" cy="0" r="2.4" class="fill"/>
  <path d="M0 0 H32"/>
  <path d="M0 -48 V-80 M0 48 V80"/>
  <circle data-pin="dc_p" data-alias="p dcp vdc" data-dir="up" cx="0" cy="-80" r="2"/>
  <circle data-pin="dc_n" data-alias="n dcn" data-dir="down" cx="0" cy="80" r="2"/>
  <circle data-pin="a" data-alias="out leg" data-dir="right" cx="32" cy="0" r="2"/>
  <circle data-logic="s" data-flow="in" data-dir="left" cx="-32" cy="-32" r="2"/>
</svg>
