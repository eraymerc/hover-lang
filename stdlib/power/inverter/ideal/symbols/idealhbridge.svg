<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -80 112 160" data-title="Ideal H-bridge inverter"
     fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <style>.fill{fill:#000}.bold{stroke-width:3.2}.dash{stroke-dasharray:3 2.5}[data-pin]{fill:#d00;stroke:none}[data-logic]{fill:#c90;stroke:none}</style>
  <!-- Two-level bridge drawn as its switches: each leg is a top and a bottom switch between the DC rails, output taken from the midpoint. The leg's command s (dashed) is drawn to the top switch; the bottom switch is its complement. -->
  <path d="M-64 -48 H16 M-64 48 H16"/>
  <path d="M-32 -48 V-40 M-32 -16 V16 M-32 40 V48"/>
  <circle cx="-32" cy="-40" r="2"/>
  <circle cx="-32" cy="-16" r="2"/>
  <circle cx="-32" cy="16" r="2"/>
  <circle cx="-32" cy="40" r="2"/>
  <path d="M-32 -16 L-44 -38 M-32 40 L-44 18"/>
  <path d="M-40 -80 V-30.67" class="dash"/>
  <circle cx="-32" cy="0" r="2.4" class="fill"/>
  <path d="M-32 0 H-16 V44 A4 4 0 0 1 -16 52 V80"/>
  <path d="M16 -48 V-40 M16 -16 V16 M16 40 V48"/>
  <circle cx="16" cy="-40" r="2"/>
  <circle cx="16" cy="-16" r="2"/>
  <circle cx="16" cy="16" r="2"/>
  <circle cx="16" cy="40" r="2"/>
  <path d="M16 -16 L4 -38 M16 40 L4 18"/>
  <path d="M8 -80 V-30.67" class="dash"/>
  <circle cx="16" cy="0" r="2.4" class="fill"/>
  <path d="M16 0 H32 V80"/>
  <circle data-pin="dc_p" data-alias="p dcp vdc" data-dir="left" cx="-64" cy="-48" r="2"/>
  <circle data-pin="dc_n" data-alias="n dcn" data-dir="left" cx="-64" cy="48" r="2"/>
  <circle data-pin="a" data-dir="down" cx="-16" cy="80" r="2"/>
  <circle data-logic="s_a" data-flow="in" data-dir="up" cx="-40" cy="-80" r="2"/>
  <circle data-pin="b" data-dir="down" cx="32" cy="80" r="2"/>
  <circle data-logic="s_b" data-flow="in" data-dir="up" cx="8" cy="-80" r="2"/>
</svg>
