  <circle cx="-48" cy="16" r="2"/>
  <circle cx="-48" cy="40" r="2"/>
  <path d="M-48 -16 L-60 -38 M-48 40 L-60 18"/>
  <path d="M-56 -80 V-30.67" class="dash"/>
  <circle cx="-48" cy="0" r="2.4" class="fill"/>
  <path d="M-48 0 H-32 V44 A4 4 0 0 1 -32 52 V80"/>
  <path d="M0 -48 V-40 M0 -16 V16 M0 40 V48"/>
  <circle cx="0" cy="-40" r="2"/>
  <circle cx="0" cy="-16" r="2"/>
  <circle cx="0" cy="16" r="2"/>
  <circle cx="0" cy="40" r="2"/>
  <path d="M0 -16 L-12 -38 M0 40 L-12 18"/>
  <path d="M-8 -80 V-30.67" class="dash"/>
  <circle cx="0" cy="0" r="2.4" class="fill"/>
  <path d="M0 0 H16 V44 A4 4 0 0 1 16 52 V80"/>
  <path d="M48 -48 V-40 M48 -16 V16 M48 40 V48"/>
  <circle cx="48" cy="-40" r="2"/>
  <circle cx="48" cy="-16" r="2"/>
  <circle cx="48" cy="16" r="2"/>
  <circle cx="48" cy="40" r="2"/>
  <path d="M48 -16 L36 -38 M48 40 L36 18"/>
  <path d="M40 -80 V-30.67" class="dash"/>
  <circle cx="48" cy="0" r="2.4" class="fill"/>
  <path d="M48 0 H64 V80"/>
  <circle data-pin="dc_p" data-alias="p dcp vdc" data-dir="left" cx="-80" cy="-48" r="2"/>
  <circle data-pin="dc_n" data-alias="n dcn" data-dir="left" cx="-80" cy="48" r="2"/>
  <circle data-pin="a" data-alias="u" data-dir="down" cx="-32" cy="80" r="2"/>
  <circle data-logic="s_a" data-flow="in" data-dir="up" cx="-56" cy="-80" r="2"/>
  <circle data-pin="b" data-alias="v" data-dir="down" cx="16" cy="80" r="2"/>
  <circle data-logic="s_b" data-flow="in" data-dir="up" cx="-8" cy="-80" r="2"/>
  <circle data-pin="c" data-alias="w" data-dir="down" cx="64" cy="80" r="2"/>
  <circle data-logic="s_c" data-flow="in" data-dir="up" cx="40" cy="-80" r="2"/>
</svg>
