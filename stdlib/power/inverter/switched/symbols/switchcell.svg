<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -32 56 64" data-title="Switch with anti-parallel diode"
     fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <style>.fill{fill:#000}.bold{stroke-width:3.2}.dash{stroke-dasharray:3 2.5}[data-pin]{fill:#d00;stroke:none}[data-logic]{fill:#c90;stroke:none}</style>
  <!-- Gate-controlled Ron/Roff switch with its anti-parallel diode, cathode towards p. -->
  <path d="M0 -32 V-12 M0 12 V32"/>
  <circle cx="0" cy="-12" r="2"/>
  <circle cx="0" cy="12" r="2"/>
  <path d="M0 12 L-12 -10"/>
  <path d="M0 -24 H10 V24 H0"/>
  <polygon points="6,5 14,5 10,-3" class="fill"/>
  <path d="M6 -3 H14"/>
  <circle cx="0" cy="-24" r="1.6" class="fill"/>
  <circle cx="0" cy="24" r="1.6" class="fill"/>
  <path d="M-32 0 H-6.55" class="dash" data-if-pin="g"/>
  <circle data-pin="p" data-alias="d c drain collector" data-dir="up" cx="0" cy="-32" r="2"/>
  <circle data-pin="n" data-alias="s e source emitter" data-dir="down" cx="0" cy="32" r="2"/>
  <circle data-logic="g" data-alias="gate" data-flow="in" data-dir="left" cx="-32" cy="0" r="2"/>
</svg>
