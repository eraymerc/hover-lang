<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -32 40 64" data-title="PWL diode"
     fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <style>.fill{fill:#000}.bold{stroke-width:3.2}.dash{stroke-dasharray:3 2.5}[data-pin]{fill:#d00;stroke:none}[data-logic]{fill:#c90;stroke:none}</style>
  <!-- Smoothed piecewise-linear diode (Vf + Rd): drawn as a plain diode, anode up. -->
  <path d="M0 -32 V-12 M0 12 V32"/>
  <polygon points="-12,-12 12,-12 0,7.2" class="fill"/>
  <rect x="-12" y="7.2" width="24" height="4.8" class="fill"/>
  <path d="M8 -4 L14 -4 L20 -12"/>
  <circle data-pin="anode" data-alias="a + p" data-dir="up" cx="0" cy="-32" r="2"/>
  <circle data-pin="cathode" data-alias="k c - n" data-dir="down" cx="0" cy="32" r="2"/>
</svg>
