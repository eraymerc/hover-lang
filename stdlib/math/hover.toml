# The `math` standard-library package.
#
# WHY THIS IS ITS OWN PACKAGE, not part of one big "stdlib" package:
# the first segment of an angle import IS the package name. `import <math>`
# names a package called "math". So each top-level directory under stdlib/ is
# a separate package, and there are four of them — math, semiconductors,
# optoelectronics, electromechanical.
#
# That is what makes `import <math>` keep working whether math is the copy
# bundled next to the hover binary or a version pinned in a project's
# hover.lock. Resolution is lockfile-first, bundled-stdlib-second, so
# installing a package named "math" overrides the bundled one — which is how
# you pin a standard-library version without editing a single import.
#
# Declarative only; hover never executes this file.

[package]
name = "math"
version = "0.8.0"

[dependencies]
# None. math.hvr reaches libm through `importc "<math.h>"`, which is a C
# include rather than a Hover import, and physicalmath.hvr is a SIBLING file
# in this same directory — files in one directory share a namespace, so it
# needs no import to use math.hvr's declarations.
