# The `semiconductors` standard-library package.
#
# Covers this directory and its subdirectories: diode.hvr at the root, plus
# bjt/ and mosfet/. Those subdirectories ship WITH this package but are
# separate import units — `import <semiconductors>` gives you Diode only, and
# `import <semiconductors/bjt>` is a second import. Subdirectories are never
# pulled in implicitly, in Hover as in Go and Python.
#
# Declarative only; hover never executes this file.

[package]
name = "semiconductors"
version = "0.8.0"

[dependencies]
# Real, and not a formality: every device model here reaches for math.
#
#   diode.hvr         from <math> import exp;
#   bjt/npn.hvr       from <math> import exp, limexp;
#   bjt/pnp.hvr       from <math> import exp;
#   mosfet/nmos.hvr   from <math> import fabs, floor;
#   mosfet/pmos.hvr   from <math> import fabs;
#
# It is declared because imports are NOT transitive: a consumer having
# imported math does nothing for this package, so relying on that would make
# these models compile or not depending on what the consumer happened to
# write. `limexp` and `pnjlim` come from math/physicalmath.hvr, which is part
# of the same math package.
#
# The caret allows any compatible 0.8.x, so a patch release of math does not
# require touching this file.
math = "^0.8.0"
