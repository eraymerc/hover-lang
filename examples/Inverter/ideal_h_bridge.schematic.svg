<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 24 880 656" class="hv-schematic" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
  <!-- Reference and modulator (digital) -->
  <rect x="64" y="64" width="112" height="48"/>
  <text x="120" y="84" text-anchor="middle">SineRef</text>
  <text x="120" y="101" text-anchor="middle" class="dim" font-size="10">50 Hz  m = 0.8</text>
  <path d="M120 64 V42" class="dash"/>
  <polygon points="120,36 116.5,43 123.5,43" class="fill"/>
  <text x="130" y="46" class="net">v_ref</text>
  <path d="M176 88 H234" class="dash"/>
  <polygon points="240,88 233,84.5 233,91.5" class="fill"/>
  <text x="208" y="81" text-anchor="middle" class="dim">ref</text>
  <rect x="240" y="64" width="160" height="48"/>
  <text x="320" y="84" text-anchor="middle">SpwmBipolar</text>
  <text x="320" y="101" text-anchor="middle" class="dim" font-size="10">20 kHz</text>
  <path d="M272 112 V138 M368 112 V138" class="dash"/>
  <polygon points="272,144 268.5,137 275.5,137" class="fill"/>
  <polygon points="368,144 364.5,137 371.5,137" class="fill"/>
  <text x="266" y="134" text-anchor="end" class="net">s_a</text>
  <text x="374" y="134" class="net">s_b</text>

  <!-- DC bus -->
  <g transform="translate(160,304)">
    <path d="M0 -32 V-16 M0 16 V32"/>
    <circle cx="0" cy="0" r="16" class="bold"/>
    <path d="M-3.5 -7 H3.5 M0 -10.5 V-3.5"/>
    <path d="M-3.5 7 H3.5"/>
  </g>
  <text x="136" y="300" text-anchor="end">vbus</text>
  <text x="136" y="316" text-anchor="end">24 V</text>
  <path d="M160 272 V208 H224"/>
  <path d="M160 336 V400 H224"/>
  <polygon points="189,208 196,204.5 196,211.5" class="fill"/>
  <text x="192" y="200" text-anchor="middle" class="net">I(vbus)</text>
  <circle class="dot" cx="160" cy="400" r="2.4"/>
  <path d="M160 400 V416 M152 416 H168 M155 419 H165 M158 422 H162"/>

  <!-- Ideal H-bridge (stdlib symbol, drawn at 2x): s_x drives the top switch, the bottom one is its complement -->
  <g transform="translate(352,304)">
    <path d="M-128 -96 H32 M-128 96 H32"/>
    <path d="M-64 -96 V-80 M-64 -32 V32 M-64 80 V96"/>
    <circle cx="-64" cy="-80" r="2.4"/>
    <circle cx="-64" cy="-32" r="2.4"/>
    <circle cx="-64" cy="32" r="2.4"/>
    <circle cx="-64" cy="80" r="2.4"/>
    <path d="M-64 -32 L-88 -76 M-64 80 L-88 36"/>
    <path d="M-80 -160 V-61.33" class="dash"/>
    <circle cx="-64" cy="0" r="2.4" class="fill"/>
    <path d="M-64 0 H-32 V88 A8 8 0 0 1 -32 104 V160"/>
    <path d="M32 -96 V-80 M32 -32 V32 M32 80 V96"/>
    <circle cx="32" cy="-80" r="2.4"/>
    <circle cx="32" cy="-32" r="2.4"/>
    <circle cx="32" cy="32" r="2.4"/>
    <circle cx="32" cy="80" r="2.4"/>
    <path d="M32 -32 L8 -76 M32 80 L8 36"/>
    <path d="M16 -160 V-61.33" class="dash"/>
    <circle cx="32" cy="0" r="2.4" class="fill"/>
    <path d="M32 0 H64 V160"/>
  </g>

  <!-- Bridge outputs -->
  <path d="M416 464 V480 H512"/>
  <path d="M320 464 V640 H512"/>
  <text x="464" y="472" text-anchor="middle" class="net">bridge_b</text>
  <text x="464" y="658" text-anchor="middle" class="net">bridge_a</text>

  <!-- LC filter -->
  <g transform="translate(544,480) rotate(-90)">
    <path d="M0 -32 V-21.12 M0 21.12 V32"/>
    <path d="M0 -21.12 a5.28 5.28 0 0 1 0 10.56 a5.28 5.28 0 0 1 0 10.56 a5.28 5.28 0 0 1 0 10.56 a5.28 5.28 0 0 1 0 10.56" class="bold"/>
  </g>
  <text x="544" y="462" text-anchor="middle">lb 14 mH</text>
  <g transform="translate(544,640) rotate(-90)">
    <path d="M0 -32 V-21.12 M0 21.12 V32"/>
    <path d="M0 -21.12 a5.28 5.28 0 0 1 0 10.56 a5.28 5.28 0 0 1 0 10.56 a5.28 5.28 0 0 1 0 10.56 a5.28 5.28 0 0 1 0 10.56" class="bold"/>
  </g>
  <text x="544" y="658" text-anchor="middle">la 14 mH</text>
  <path d="M576 480 H752"/>
  <path d="M576 640 H752"/>
  <polygon points="611,480 604,476.5 604,483.5" class="fill"/>
  <text x="608" y="472" text-anchor="middle" class="net">I(lb)</text>
  <polygon points="611,640 604,636.5 604,643.5" class="fill"/>
  <text x="608" y="658" text-anchor="middle" class="net">I(la)</text>
  <text x="704" y="472" text-anchor="middle" class="net">out_n</text>
  <text x="704" y="658" text-anchor="middle" class="net">out_p</text>

  <!-- Load -->
  <circle class="dot" cx="656" cy="480" r="2.4"/>
  <circle class="dot" cx="656" cy="640" r="2.4"/>
  <path d="M656 480 V528 M656 592 V640"/>
  <g transform="translate(656,560)">
    <path d="M0 -32 V-20.8 M0 20.8 V32"/>
    <rect x="-8.8" y="-20.8" width="17.6" height="41.6" class="bold"/>
  </g>
  <text x="670" y="564">200 Ω</text>

  <!-- Split capacitors, common-mode damping leg -->
  <g transform="translate(752,512)">
    <path d="M0 -32 V-7.52 M0 7.52 V32"/>
    <rect x="-12" y="-7.52" width="24" height="4.8" class="fill"/>
    <rect x="-12" y="2.72" width="24" height="4.8" class="fill"/>
  </g>
  <g transform="translate(752,608)">
    <path d="M0 -32 V-7.52 M0 7.52 V32"/>
    <rect x="-12" y="-7.52" width="24" height="4.8" class="fill"/>
    <rect x="-12" y="2.72" width="24" height="4.8" class="fill"/>
  </g>
  <text x="738" y="516" text-anchor="end">1.4 µF</text>
  <text x="738" y="612" text-anchor="end">1.4 µF</text>
  <path d="M752 544 V576"/>
  <circle class="dot" cx="752" cy="560" r="2.4"/>
  <path d="M752 560 H800"/>
  <text x="776" y="552" text-anchor="middle" class="net">cm_mid</text>
  <g transform="translate(832,560) rotate(90)">
    <path d="M0 -32 V-20.8 M0 20.8 V32"/>
    <rect x="-8.8" y="-20.8" width="17.6" height="41.6" class="bold"/>
  </g>
  <text x="832" y="544" text-anchor="middle">68 Ω</text>
  <path d="M864 560 H896 V608 M888 608 H904 M891 611 H901 M894 614 H898"/>
</svg>
